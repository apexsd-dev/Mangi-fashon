<style>

*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Segoe UI",Tahoma,serif;color:var(--text);min-height:100vh;background:linear-gradient(120deg,var(--bg),var(--g2),var(--g3),var(--bg));background-size:300% 300%;animation:bgm 18s ease infinite}
@keyframes bgm{50%{background-position:100% 50%}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
.hide{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--solid);margin-top:4px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
label,.kv{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);margin-top:10px}

.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.red{background:#b3261e}.btn.on{background:var(--accent);color:#fff}
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.12);animation:up .5s both;margin-bottom:16px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login .card{width:100%;max-width:380px;text-align:center}
#login .card.sh{animation:shake .5s}
.logo{width:96px;height:96px;margin:0 auto;color:var(--accent);animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));cursor:pointer;display:block}
h1{margin:8px 0 2px;font-size:1.7rem}.sub{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.err{color:#d6382e;min-height:1.3em;font-size:.95rem;margin:8px 0;font-weight:600}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;background:var(--card);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
header svg{width:34px;height:34px;color:var(--accent)}header b{font-size:1.1rem;flex:1}
nav,.seg{display:flex;gap:8px}nav{padding:12px 16px 0;max-width:1000px;margin:auto}nav button,.seg button{flex:1}
main{max-width:1000px;margin:auto;padding:14px 16px 40px}
.greet{font-size:1.25rem;margin:6px 0 14px;animation:up .6s both}.greet small{display:block;color:var(--muted);font-size:1rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px;animation:up .4s both}
.item:hover{background:var(--line)}.item small{color:var(--muted);display:block}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap}
h3{margin:0 0 6px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s;z-index:30}#ov.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;height:55vh;overflow:auto;background:var(--solid);border-radius:20px 20px 0 0;padding:18px;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
@media(min-width:900px){#sheet{left:auto;top:0;height:auto;width:min(480px,50vw);border-radius:20px 0 0 20px;transform:translateX(-105%);right:auto;left:auto;inset-inline-end:0;transform:translateX(105%)}#sheet.on{transform:none}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}#toast.show{opacity:1}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;color:#000;background:#fff;padding:24px}#printArea table{width:100%;border-collapse:collapse}#printArea td{border-bottom:1px solid #999;padding:8px 4px;vertical-align:top}}

var cv=$("bg"),x=cv.getContext("2d"),W,H,t=0,P=[];
